<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skrol Ajaib</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at center,#29335c 0%,#101327 65%,#080b17 100%);color:#fff;font-family:Georgia,serif;display:flex;align-items:center;justify-content:center;padding:18px}
#app{width:min(100%,900px);min-height:600px;overflow:hidden;border-radius:20px;text-align:center;position:relative;padding:24px 16px;background:radial-gradient(ellipse at center,rgba(41,51,92,.35),rgba(8,11,23,.2))}
.gold{color:#ffe7a0;text-shadow:0 0 12px #ffc54d}
h1{font-size:clamp(28px,5vw,42px);margin:12px 0}
#hint{color:#d1d5e2;font-size:15px;line-height:1.5}
#stage{position:relative;margin:auto;width:100%;max-width:620px;min-height:290px;display:flex;align-items:center;justify-content:center}
#scrollbtn{position:relative;margin:25px auto;width:210px;height:180px;border:0;background:transparent;cursor:pointer;display:block;filter:drop-shadow(0 0 12px #eeb84a);transition:transform .3s}
#scrollbtn:hover{transform:scale(1.06)}
.paper{position:absolute;left:43px;right:43px;top:24px;bottom:24px;background:linear-gradient(90deg,#9b5a22,#ffe7a0 25%,#d5a04b 70%,#8d4d1b);border:2px solid #ffe4a0;border-radius:3px;box-shadow:inset 0 0 15px #713d12}
.roll{position:absolute;top:15px;bottom:15px;width:43px;border:2px solid #ffe4a0;border-radius:22px;background:linear-gradient(90deg,#6f3b14,#efc16b,#99571d,#f9d98a,#774018);box-shadow:inset 0 0 9px #ffe9a3}
.roll.left{left:24px}.roll.right{right:24px}
.seal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:34px;filter:drop-shadow(0 0 8px #ffdc79)}
.spark{position:absolute;pointer-events:none;color:#ffe89b;animation:magicFloat 1.8s ease-out forwards;text-shadow:0 0 12px #ffbc36}
@keyframes magicFloat{0%{opacity:0;transform:translate(0,20px) scale(.3)}25%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-150px) scale(1.5)}}
@keyframes unfold{0%{transform:scaleY(.12) scaleX(.7);opacity:.1}60%{transform:scaleY(1.08) scaleX(1.04);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes glowburst{0%{opacity:0;transform:scale(.2)}45%{opacity:1}100%{opacity:0;transform:scale(2.3)}}
@keyframes reveal{0%{opacity:0;transform:scale(.7);filter:brightness(3) blur(8px)}65%{opacity:1;filter:brightness(1.5) blur(0)}100%{opacity:1;transform:scale(1);filter:brightness(1)}}
.opening{animation:unfold 1.3s ease-in-out forwards;transform-origin:center}
.revealed{animation:reveal 1.5s ease-out both}
.glowring{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(255,224,123,.8),rgba(255,188,43,.3) 30%,transparent 70%);animation:glowburst 1.4s ease-out forwards;pointer-events:none}
.primary{background:linear-gradient(135deg,#ffe8a1,#c78c32);color:#281707;font-weight:bold;border-radius:999px;padding:12px 20px;border:1px solid #fff0b6;cursor:pointer}
.secondary{border:1px solid #c8a55d;border-radius:999px;padding:10px 16px;color:#ffe7a0;background:#222642;cursor:pointer}
.preview{width:100%;max-height:55vh;object-fit:contain;border-radius:10px;display:block;margin:auto}
#picture{width:100%;max-width:620px;margin:auto}
#picture img{box-shadow:0 0 24px #eabf5b55}
#placeholder{border:1px solid #c8a55d;border-radius:12px;padding:30px 16px;background:#0003}
#placeholder .emoji{font-size:58px;margin-bottom:12px}
input[type=file]{display:none}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:16px}
#actions{display:none}
#status{min-height:24px;margin-top:12px}
.small{font:12px Arial,sans-serif;color:#9ca3b7;margin-top:18px}
.utilitybar{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:14px 0 6px}
.utilitybar button[aria-pressed="true"]{background:linear-gradient(135deg,#ffe8a1,#c78c32);color:#281707;border-color:#fff0b6}
body.lcd-mode{padding:0;min-height:100vh}
body.lcd-mode #app{width:100%;max-width:none;min-height:100vh;border-radius:0;padding:clamp(18px,3vh,40px) clamp(14px,3vw,48px)}
body.lcd-mode h1{font-size:clamp(38px,5vw,64px)}
body.lcd-mode #hint{font-size:clamp(18px,2vw,25px)}
body.lcd-mode #stage{max-width:1000px;min-height:clamp(300px,48vh,600px)}
body.lcd-mode #scrollbtn{transform:scale(1.35);margin:50px auto}
body.lcd-mode #scrollbtn:hover{transform:scale(1.42)}
body.lcd-mode .preview{max-height:62vh}
body.lcd-mode .primary,body.lcd-mode .secondary{font-size:clamp(16px,1.5vw,22px);padding:14px 24px}
body.lcd-mode .small{font-size:14px}
body.lcd-mode #status{font-size:18px}
@media(max-width:600px){body.lcd-mode #scrollbtn{transform:scale(1.05);margin:22px auto}body.lcd-mode #scrollbtn:hover{transform:scale(1.08)}body.lcd-mode #stage{min-height:290px}body.lcd-mode .preview{max-height:55vh}}

.hidden{display:none!important}
label.secondary{display:inline-flex;align-items:center;cursor:pointer}
@media(max-width:480px){body{padding:6px}#app{padding:20px 10px;min-height:95vh;border-radius:14px}#stage{min-height:250px}#scrollbtn{transform:scale(.92);margin:15px auto}#scrollbtn:hover{transform:scale(.96)}.preview{max-height:52vh}h1{font-size:30px}}
@media(prefers-reduced-motion:reduce){.spark,.opening,.revealed,.glowring{animation-duration:.01ms!important}}
</style>
</head>
<body>
<main id="app">
  <div class="gold" style="font:12px Arial,sans-serif;letter-spacing:.3em;text-transform:uppercase">✧ ALAM MISTERI ✧</div>
  <h1>Skrol Ajaib</h1>
  <p id="hint">Sentuh skrol untuk membuka rahsia yang tersembunyi.</p>
  <div id="stage">
    <button id="scrollbtn" aria-label="Buka skrol ajaib">
      <div class="paper"></div><div class="roll left"></div><div class="roll right"></div><div class="seal">✧</div>
    </button>
    <div id="burst" class="hidden" style="position:absolute;inset:0;pointer-events:none"></div>
    <section id="picture" class="hidden">
      <img id="userpic" class="preview hidden" alt="Gambar yang dimuat naik">
      <div id="placeholder" class="hidden">
        <div class="emoji">✨</div><p class="gold" style="font-size:22px">Rahsia Telah Terbongkar!</p>
        <p style="font:14px Arial,sans-serif;color:#d1d5e2">Muat naik gambar anda untuk melihatnya di sini.</p>
      </div>
      <p class="gold" style="font-size:12px;margin-top:12px">✦ PENEMUAN AJAIB ANDA ✦</p>
    </section>
  </div>
  <div class="utilitybar">
    <button id="lcdmode" class="secondary" aria-pressed="false">▣ Mode LCD</button>
    <button id="fullscreen" class="secondary">⛶ Full Screen</button>
  </div>
  <div id="uploadrow" class="row">
    <label class="secondary" for="imagefile">▧ Muat naik gambar</label>
    <input id="imagefile" type="file" accept="image/*">
  </div>
  <div id="actions" class="row">
    <button id="again" class="primary">↻ Ulang Semula</button>
    <label class="secondary" for="imagefile">Tukar gambar</label>
  </div>
  <div class="row"><button id="soundbtn" class="secondary">♫ Bunyi: Aktif</button></div>
  <p class="small">Direka untuk telefon, tablet dan komputer</p>
  <p id="status" class="gold" aria-live="polite"></p>
</main>

 function audio(type) {
   if (!soundOn) return;
   try {
     if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
     if (ctx.state === 'suspended') ctx.resume();
     const now = ctx.currentTime;
     if (type === 'open') {
       [392,523,659,784,1046].forEach((f,i) => {
         const o=ctx.createOscillator(), g=ctx.createGain();
         o.type='sine'; o.frequency.setValueAtTime(f,now+i*.12);
         g.gain.setValueAtTime(.0001,now+i*.12);
         g.gain.exponentialRampToValueAtTime(.12,now+i*.12+.04);
         g.gain.exponentialRampToValueAtTime(.0001,now+i*.12+.48);
         o.connect(g); g.connect(ctx.destination); o.start(now+i*.12); o.stop(now+i*.12+.5);
       });
     } else {
       const o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';
       o.frequency.setValueAtTime(660,now);o.frequency.exponentialRampToValueAtTime(990,now+.18);
       g.gain.setValueAtTime(.07,now);g.gain.exponentialRampToValueAtTime(.001,now+.35);
       o.connect(g);g.connect(ctx.destination);o.start();o.stop(now+.36);
     }
   } catch(e) {}
 }
 function sparks(n) {
   const stage=$('stage');
   for(let i=0;i<n;i++){
     const s=document.createElement('span');s.className='spark';s.textContent=['✦','✧','⋆','✴','·'][i%5];
     s.style.left=(8+Math.random()*84)+'%';s.style.top=(15+Math.random()*65)+'%';
     s.style.fontSize=(12+Math.random()*23)+'px';s.style.setProperty('--dx',((Math.random()-.5)*150)+'px');
     stage.appendChild(s);setTimeout(()=>s.remove(),1900);
   }
 }
 function reset() {
   playing=false;
   scroll.classList.remove('hidden','opening');scroll.style.display='block';
   pic.classList.add('hidden');$('burst').classList.add('hidden');
   $('actions').style.display='none';$('uploadrow').classList.remove('hidden');
   $('hint').textContent='Sentuh skrol untuk membuka rahsia yang tersembunyi.';
   $('status').textContent='';
   if(imageUrl){img.src=imageUrl;img.classList.remove('hidden');placeholder.classList.add('hidden');}
 }
 function openScroll() {
   if(playing)return;playing=true;audio('open');
   $('hint').textContent='Cahaya ajaib sedang membongkar rahsia...';
   $('status').textContent='✧ Kuasa ajaib sedang aktif ✧';
   const burst=$('burst');burst.classList.remove('hidden');burst.innerHTML='<div class="glowring"></div>';
   sparks(34);scroll.classList.add('opening');
   setTimeout(()=>{
     scroll.style.display='none';pic.classList.remove('hidden');pic.classList.remove('revealed');void pic.offsetWidth;pic.classList.add('revealed');
     if(imageUrl){img.src=imageUrl;img.classList.remove('hidden');placeholder.classList.add('hidden');}
     else{img.classList.add('hidden');placeholder.classList.remove('hidden');}
     $('uploadrow').classList.add('hidden');$('actions').style.display='flex';
     $('hint').textContent='Rahsia anda kini terbuka!';$('status').textContent='✨ Gambar ajaib telah muncul ✨';
     sparks(24);audio('chime');setTimeout(()=>burst.classList.add('hidden'),1500);playing=false;
   },1250);
 }
 // Gambar utama pengguna dipaparkan selepas skrol dibuka.
 img.src = imageUrl;
 img.classList.remove('hidden');
 placeholder.classList.add('hidden');
 scroll.addEventListener('click',openScroll);
 // Ulang Semula mengembalikan aplikasi ke keadaan awal tanpa memadam gambar yang dipilih.
 $('again').addEventListener('click',reset);
 $('imagefile').addEventListener('change',e=>{
   const f=e.target.files&&e.target.files[0];if(!f)return;
   if(!f.type.startsWith('image/')){$('status').textContent='Sila pilih fail gambar.';return;}
   if(f.size>15*1024*1024){$('status').textContent='Gambar terlalu besar. Sila pilih gambar bawah 15 MB.';return;}
   const reader=new FileReader();
   reader.onload=ev=>{
     imageUrl=ev.target.result;img.src=imageUrl;img.classList.remove('hidden');placeholder.classList.add('hidden');
     $('status').textContent='✓ Gambar anda sedia untuk didedahkan!';
     if(!playing&&pic.classList.contains('hidden'))$('hint').textContent='Gambar sedia. Tekan skrol untuk mendedahkannya.';
     else if(!pic.classList.contains('hidden')){pic.classList.remove('revealed');void pic.offsetWidth;pic.classList.add('revealed');}
   };
   reader.readAsDataURL(f);
 });
 $('lcdmode').addEventListener('click',()=>{
   const enabled=document.body.classList.toggle('lcd-mode');
   $('lcdmode').setAttribute('aria-pressed',String(enabled));
   $('lcdmode').textContent=enabled?'▣ Keluar Mode LCD':'▣ Mode LCD';
 });
 $('fullscreen').addEventListener('click',async()=>{
   try{
     if(!document.fullscreenElement){
       await document.documentElement.requestFullscreen();
       $('fullscreen').textContent='⛶ Keluar Full Screen';
     }else{
       await document.exitFullscreen();
     }
   }catch(err){
     $('status').textContent='Full screen tidak disokong oleh pelayar ini. Cuba buka fail menggunakan Chrome.';
   }
 });
 document.addEventListener('fullscreenchange',()=>{
   if(document.fullscreenElement)$('fullscreen').textContent='⛶ Keluar Full Screen';
   else $('fullscreen').textContent='⛶ Full Screen';
 });
 $('soundbtn').addEventListener('click',()=>{
   soundOn=!soundOn;$('soundbtn').textContent='♫ Bunyi: '+(soundOn?'Aktif':'Senyap');
   if(soundOn)audio('chime');
 });
})();
</script>
